<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Speaker Placement Analyzer v3.0</title>
<style>
body{font-family:Arial,sans-serif;margin:20px}
button{padding:10px 16px;margin-right:10px}
.controls{margin-bottom:20px}
pre{background:#111;color:#eee;padding:12px;white-space:pre-wrap;max-height:1000px;overflow:auto}
</style>
</head>
<body>
<h1>Speaker Placement Analyzer v3.0</h1>
<p>Required names: <b>FL, C, FR, SL, SR, SUB</b></p>
<p>Optional: <b>L+R</b> (combined left+right measurement)</p>
<div class="controls">
  <button id="runBtn">Run Analysis</button>
  <button id="clearBtn">Clear Output</button>
</div>
<pre id="out">PAGE LOADED
</pre>
<script>
const CM_PER_MS = 34.3;
const REQUIRED = ['FL','C','FR','SL','SR','SUB'];
const OPTIONAL = ['L+R'];
const TH = { excellent:1, good:3, attention:5, critical:20 };
const out = document.getElementById('out');

function log(x=''){ out.textContent += x + '\n'; }

function classify(cm){
  const a=Math.abs(cm);
  if(a<TH.excellent) return 'Excellent';
  if(a<TH.good) return 'Good';
  if(a<TH.attention) return 'Needs Attention';
  if(a<TH.critical) return 'Investigate';
  return 'Critical';
}

function analyzeIR(irData, sampleRate){
  if(!irData || irData.length === 0) return null;
  
  // Convert to float array if needed
  const data = Array.isArray(irData) ? irData : Object.values(irData);
  
  // Find peak
  let peakIdx = 0, peakVal = 0;
  for(let i = 0; i < data.length; i++){
    const abs = Math.abs(data[i]);
    if(abs > peakVal){
      peakVal = abs;
      peakIdx = i;
    }
  }
  
  // Energy before peak (pre-cursor)
  let preEnergy = 0;
  for(let i = 0; i < peakIdx; i++){
    preEnergy += data[i] * data[i];
  }
  preEnergy = Math.sqrt(preEnergy);
  
  // Energy after peak (decay)
  let postEnergy = 0;
  for(let i = peakIdx + 1; i < data.length; i++){
    postEnergy += data[i] * data[i];
  }
  postEnergy = Math.sqrt(postEnergy);
  
  // Crest factor (peak to RMS)
  let totalEnergy = 0;
  for(let i = 0; i < data.length; i++){
    totalEnergy += data[i] * data[i];
  }
  const rms = Math.sqrt(totalEnergy / data.length);
  const crestFactor = rms > 0 ? peakVal / rms : 0;
  
  // First reflection (find first significant peak after main peak, within 50ms)
  const maxSearchSamples = Math.floor((sampleRate / 1000) * 50); // 50ms
  const maxSearchIdx = Math.min(peakIdx + maxSearchSamples, data.length);
  let firstReflectionIdx = -1;
  let reflectionThreshold = peakVal * 0.05; // 5% of peak
  for(let i = peakIdx + 100; i < maxSearchIdx; i++){
    if(Math.abs(data[i]) > reflectionThreshold){
      firstReflectionIdx = i;
      break;
    }
  }
  
  // Energy decay calculation
  const decayStart = peakIdx;
  const decayWindowSamples = Math.floor((sampleRate / 1000) * 100); // 100ms window
  const decayEnd = Math.min(decayStart + decayWindowSamples, data.length);
  let decayEnergy = 0;
  for(let i = decayStart; i < decayEnd; i++){
    decayEnergy += data[i] * data[i];
  }
  decayEnergy = Math.sqrt(decayEnergy);
  
  return {
    peakIdx,
    peakVal,
    preEnergy,
    postEnergy,
    crestFactor,
    prePostRatio: postEnergy > 0 ? postEnergy / (preEnergy + postEnergy) : 0,
    firstReflectionIdx,
    firstReflectionTime: firstReflectionIdx >= 0 ? (firstReflectionIdx - peakIdx) / sampleRate * 1000 : -1,
    decayEnergy,
    dataLength: data.length
  };
}

async function run(){
  log('BUTTON CLICKED');
  try {
    log('Connecting to REW...');
    const r = await fetch('http://localhost:4735/measurements');
    log('HTTP STATUS: ' + r.status);

    const raw = await r.json();
    const arr = Array.isArray(raw) ? raw : Object.values(raw);
    log('Found ' + arr.length + ' measurements');

    const m = {};
    for(const n of REQUIRED){
      m[n] = arr.find(x => x.title === n);
      log((m[n] ? '✓ ' : '✗ ') + n);
    }

    if(REQUIRED.some(n => !m[n])){
      log('Missing required measurements.');
      return;
    }

    const hasLPlusR = arr.find(x => x.title === 'L+R');
    log((hasLPlusR ? '✓ ' : '○ ') + 'L+R (optional)');
    if(hasLPlusR) m['L+R'] = hasLPlusR;

    log('\nDiagnostics complete. Beginning analysis...');

    const p = {};
    REQUIRED.forEach(n => p[n] = m[n].timeOfIRPeakSeconds);
    if(m['L+R']) p['L+R'] = m['L+R'].timeOfIRPeakSeconds;

    // Get sample rate from first available measurement
    let sampleRate = 48000; // default
    for(const key in m){
      if(m[key].sampleRate){
        sampleRate = m[key].sampleRate;
        log(`Sample Rate: ${sampleRate} Hz`);
        break;
      }
    }

    // Analyze IR data
    const irAnalysis = {};
    for(const name of Object.keys(m)){
      if(m[name].irData){
        irAnalysis[name] = analyzeIR(m[name].irData, sampleRate);
      }
    }

    function section(title,aName,a,bName,b,isCenter=false,extraInfo=''){
      const ms = (b-a)*1000;
      const cm = ms*CM_PER_MS;
      const st = classify(cm);

      log('\n' + title);
      log('-'.repeat(title.length));
      log(`${aName}: ${(a*1000).toFixed(3)} ms`);
      log(`${bName}: ${(b*1000).toFixed(3)} ms`);
      log(`Difference: ${ms.toFixed(3)} ms (${cm.toFixed(2)} cm)`);
      log('Status: ' + st);

      return { st };
    }

    // TIMING ANALYSIS
    log('\n\n========== TIMING ANALYSIS ==========\n');

    const flFrMs = (p.FR - p.FL) * 1000;
    const flFrCm = flFrMs * CM_PER_MS;
    const frontResult = section('Front Stage Distance','FL',p.FL,'FR',p.FR);

    const centerFrontMidpoint = (p.FL+p.FR)/2;
    section('Center Alignment','Front Midpoint',centerFrontMidpoint,'Center',p.C,true,Math.abs(flFrCm));

    const slSrMs = (p.SR - p.SL) * 1000;
    const slSrCm = slSrMs * CM_PER_MS;
    const surroundResult = section('Surround Stage Distance','SL',p.SL,'SR',p.SR);

    log('\nLeft Channel Distance');
    log('--------------------');
    log(`FL (Front Left): ${(p.FL*1000).toFixed(3)} ms`);
    log(`SL (Surround Left): ${(p.SL*1000).toFixed(3)} ms`);
    const flSlMs = (p.SL - p.FL) * 1000;
    const flSlCm = flSlMs * CM_PER_MS;
    log(`FL to SL distance offset: ${flSlMs.toFixed(3)} ms (${flSlCm.toFixed(2)} cm)`);
    log('Status: ' + classify(flSlCm));

    log('\nRight Channel Distance');
    log('---------------------');
    log(`FR (Front Right): ${(p.FR*1000).toFixed(3)} ms`);
    log(`SR (Surround Right): ${(p.SR*1000).toFixed(3)} ms`);
    const frSrMs = (p.SR - p.FR) * 1000;
    const frSrCm = frSrMs * CM_PER_MS;
    log(`FR to SR distance offset: ${frSrMs.toFixed(3)} ms (${frSrCm.toFixed(2)} cm)`);
    log('Status: ' + classify(frSrCm));

    log('\nCenter to Front Distance');
    log('------------------------');
    log(`C (Center): ${(p.C*1000).toFixed(3)} ms`);
    log(`FL (Front Left): ${(p.FL*1000).toFixed(3)} ms`);
    const cFlMs = (p.C - p.FL) * 1000;
    const cFlCm = cFlMs * CM_PER_MS;
    log(`C to FL distance offset: ${cFlMs.toFixed(3)} ms (${cFlCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cFlCm)));

    log(`FR (Front Right): ${(p.FR*1000).toFixed(3)} ms`);
    const cFrMs = (p.C - p.FR) * 1000;
    const cFrCm = cFrMs * CM_PER_MS;
    log(`C to FR distance offset: ${cFrMs.toFixed(3)} ms (${cFrCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cFrCm)));

    const cFrontSymmetryMs = cFrMs - cFlMs;
    const cFrontSymmetryCm = cFrontSymmetryMs * CM_PER_MS;
    log(`C symmetry (FR offset - FL offset): ${cFrontSymmetryMs.toFixed(3)} ms (${cFrontSymmetryCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cFrontSymmetryCm)));

    log('\nCenter to Surround Distance');
    log('---------------------------');
    log(`C (Center): ${(p.C*1000).toFixed(3)} ms`);
    log(`SL (Surround Left): ${(p.SL*1000).toFixed(3)} ms`);
    const cSlMs = (p.C - p.SL) * 1000;
    const cSlCm = cSlMs * CM_PER_MS;
    log(`C to SL distance offset: ${cSlMs.toFixed(3)} ms (${cSlCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cSlCm)));

    log(`SR (Surround Right): ${(p.SR*1000).toFixed(3)} ms`);
    const cSrMs = (p.C - p.SR) * 1000;
    const cSrCm = cSrMs * CM_PER_MS;
    log(`C to SR distance offset: ${cSrMs.toFixed(3)} ms (${cSrCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cSrCm)));

    const cSurroundSymmetryMs = cSrMs - cSlMs;
    const cSurroundSymmetryCm = cSurroundSymmetryMs * CM_PER_MS;
    log(`C symmetry (SR offset - SL offset): ${cSurroundSymmetryMs.toFixed(3)} ms (${cSurroundSymmetryCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cSurroundSymmetryCm)));

    if(p['L+R']){
      const lPlusRFrontMidpoint = (p.FL+p.FR)/2;
      const lPlusRMs = (p['L+R'] - lPlusRFrontMidpoint) * 1000;
      const lPlusRCm = lPlusRMs * CM_PER_MS;
      
      log('\nL+R Measurement');
      log('---------------');
      log(`Front Stage Midpoint: ${(lPlusRFrontMidpoint*1000).toFixed(3)} ms`);
      log(`L+R: ${(p['L+R']*1000).toFixed(3)} ms`);
      log(`Difference: ${lPlusRMs.toFixed(3)} ms (${lPlusRCm.toFixed(2)} cm)`);
      log('Status: ' + classify(lPlusRCm));
    }

    // IMPULSE RESPONSE ANALYSIS
    log('\n\n========== IMPULSE RESPONSE ANALYSIS ==========\n');

    for(const name of REQUIRED){
      if(!irAnalysis[name]) continue;
      const ir = irAnalysis[name];

      log(`\n${name} - Impulse Response Metrics`);
      log('-'.repeat(name.length + 25));
      log(`Peak Value: ${ir.peakVal.toFixed(6)}`);
      log(`Pre-Cursor Energy (before peak): ${ir.preEnergy.toFixed(6)}`);
      log(`Post-Cursor Energy (after peak): ${ir.postEnergy.toFixed(6)}`);
      log(`Pre/Post Energy Ratio: ${ir.prePostRatio.toFixed(4)}`);
      log(`Crest Factor: ${ir.crestFactor.toFixed(2)}`);
      
      if(ir.firstReflectionIdx >= 0){
        log(`First Reflection Time: ${ir.firstReflectionTime.toFixed(2)} ms after peak`);
      } else {
        log(`First Reflection: Not detected within analysis window`);
      }
      
      log(`Decay Energy (0-100ms window): ${ir.decayEnergy.toFixed(6)}`);
      log(`Total IR Data Points: ${ir.dataLength}`);
    }

    // DECAY SYMMETRY ANALYSIS
    log('\n\n========== DECAY SYMMETRY ANALYSIS ==========\n');

    // Front pair comparison
    if(irAnalysis['FL'] && irAnalysis['FR']){
      const ir1 = irAnalysis['FL'];
      const ir2 = irAnalysis['FR'];

      log(`\nFront Pair (FL vs FR) Decay Comparison`);
      log('-'.repeat(38));
      log(`FL Post Energy: ${ir1.postEnergy.toFixed(6)}`);
      log(`FR Post Energy: ${ir2.postEnergy.toFixed(6)}`);
      
      const maxPostEnergy = Math.max(ir1.postEnergy, ir2.postEnergy);
      if(maxPostEnergy > 0){
        const postEnergyDiff = Math.abs(ir1.postEnergy - ir2.postEnergy) / maxPostEnergy;
        log(`Energy Difference: ${(postEnergyDiff * 100).toFixed(2)}%`);
      }

      log(`FL Crest Factor: ${ir1.crestFactor.toFixed(2)}`);
      log(`FR Crest Factor: ${ir2.crestFactor.toFixed(2)}`);
      const maxCrest = Math.max(ir1.crestFactor, ir2.crestFactor);
      if(maxCrest > 0){
        const crestDiff = Math.abs(ir1.crestFactor - ir2.crestFactor) / maxCrest;
        log(`Crest Factor Difference: ${(crestDiff * 100).toFixed(2)}%`);
      }
    }

    // Surround pair comparison
    if(irAnalysis['SL'] && irAnalysis['SR']){
      const ir1 = irAnalysis['SL'];
      const ir2 = irAnalysis['SR'];

      log(`\nSurround Pair (SL vs SR) Decay Comparison`);
      log('-'.repeat(40));
      log(`SL Post Energy: ${ir1.postEnergy.toFixed(6)}`);
      log(`SR Post Energy: ${ir2.postEnergy.toFixed(6)}`);
      
      const maxPostEnergy = Math.max(ir1.postEnergy, ir2.postEnergy);
      if(maxPostEnergy > 0){
        const postEnergyDiff = Math.abs(ir1.postEnergy - ir2.postEnergy) / maxPostEnergy;
        log(`Energy Difference: ${(postEnergyDiff * 100).toFixed(2)}%`);
      }

      log(`SL Crest Factor: ${ir1.crestFactor.toFixed(2)}`);
      log(`SR Crest Factor: ${ir2.crestFactor.toFixed(2)}`);
      const maxCrest = Math.max(ir1.crestFactor, ir2.crestFactor);
      if(maxCrest > 0){
        const crestDiff = Math.abs(ir1.crestFactor - ir2.crestFactor) / maxCrest;
        log(`Crest Factor Difference: ${(crestDiff * 100).toFixed(2)}%`);
      }
    }

    // BOUNDARY REFLECTION ANALYSIS
    log('\n\n========== BOUNDARY REFLECTION ANALYSIS ==========\n');

    for(const name of REQUIRED){
      if(!irAnalysis[name]) continue;
      const ir = irAnalysis[name];

      log(`\n${name} - First Reflection Timing`);
      log('-'.repeat(name.length + 22));
      if(ir.firstReflectionIdx >= 0){
        log(`Time to First Reflection: ${ir.firstReflectionTime.toFixed(2)} ms`);
        if(ir.firstReflectionTime < 5) log(`  ⚠ Early reflection (< 5ms) - speaker may be very close to boundary`);
        else if(ir.firstReflectionTime < 10) log(`  Early reflection (5-10ms) - speaker proximity to boundary`);
        else if(ir.firstReflectionTime < 20) log(`  Normal reflection timing (10-20ms)`);
        else log(`  Late reflection (> 20ms) - speaker far from immediate boundaries`);
      } else {
        log(`First reflection not detected`);
      }
      
      const prePostTotal = ir.preEnergy + ir.postEnergy;
      if(prePostTotal > 0){
        const preCursorPercent = ir.preEnergy / prePostTotal * 100;
        log(`Pre-Cursor Energy Ratio: ${preCursorPercent.toFixed(2)}%`);
        if(preCursorPercent > 10){
          log(`  ⚠ Significant pre-cursor energy detected`);
        }
      }
    }

    log('\n\nAnalysis complete.');
  } catch(e){
    log('ERROR: ' + e);
  }
}

function clear(){
  out.textContent = 'PAGE LOADED\n';
}

document.getElementById('runBtn').addEventListener('click', run);
document.getElementById('clearBtn').addEventListener('click', clear);
</script>
</body>
</html>
