<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Speaker Placement Analyzer v3.0</title>
<style>
body{font-family:Arial,sans-serif;margin:20px}
button{padding:10px 16px;margin-right:10px}
.controls{margin-bottom:20px}
pre{background:#111;color:#eee;padding:12px;white-space:pre-wrap;max-height:1000px;overflow:auto}
</style>
</head>
<body>
<h1>Speaker Placement Analyzer v3.0</h1>
<p>Required names: <b>FL, C, FR, SL, SR, SUB</b></p>
<p>Optional: <b>L+R</b> (combined left+right measurement)</p>
<div class="controls">
  <button id="runBtn">Run Analysis</button>
  <button id="clearBtn">Clear Output</button>
</div>
<pre id="out">PAGE LOADED
</pre>
<script>
const CM_PER_MS = 34.3;
const REQUIRED = ['FL','C','FR','SL','SR','SUB'];
const OPTIONAL = ['L+R'];
const TH = { excellent:1, good:3, attention:5, critical:20 };
const out = document.getElementById('out');

function log(x=''){ out.textContent += x + '\n'; }

function classify(cm){
  const a=Math.abs(cm);
  if(a<TH.excellent) return 'Excellent';
  if(a<TH.good) return 'Good';
  if(a<TH.attention) return 'Needs Attention';
  if(a<TH.critical) return 'Investigate';
  return 'Critical';
}

function analyzeIR(irData, sampleRate){
  if(!irData || irData.length === 0) return null;
  
  // Convert to float array if needed
  const data = Array.isArray(irData) ? irData : Object.values(irData);
  
  // Find peak
  let peakIdx = 0, peakVal = 0;
  for(let i = 0; i < data.length; i++){
    const abs = Math.abs(data[i]);
    if(abs > peakVal){
      peakVal = abs;
      peakIdx = i;
    }
  }
  
  // Energy before peak (pre-cursor)
  let preEnergy = 0;
  for(let i = 0; i < peakIdx; i++){
    preEnergy += data[i] * data[i];
  }
  preEnergy = Math.sqrt(preEnergy);
  
  // Energy after peak (decay)
  let postEnergy = 0;
  for(let i = peakIdx + 1; i < data.length; i++){
    postEnergy += data[i] * data[i];
  }
  postEnergy = Math.sqrt(postEnergy);
  
  // Crest factor (peak to RMS)
  let totalEnergy = 0;
  for(let i = 0; i < data.length; i++){
    totalEnergy += data[i] * data[i];
  }
  const rms = Math.sqrt(totalEnergy / data.length);
  const crestFactor = rms > 0 ? peakVal / rms : 0;
  
  // First significant event (search from 1ms to 20ms after direct arrival)
  const minReflectionDelayMs = 1.0;
  const maxReflectionDelayMs = 20.0;
  const minEventSpacingMs = 0.5;

  const startIdx = peakIdx + Math.floor(sampleRate * minReflectionDelayMs / 1000);
  const maxSearchIdx = Math.min(
    peakIdx + Math.floor(sampleRate * maxReflectionDelayMs / 1000),
    data.length
  );

  const eventThresholdDb = -30;
  const eventThreshold = peakVal * Math.pow(10, eventThresholdDb / 20);

  let firstEventIdx = -1;
  let firstEventAmplitude = 0;
  let strongestEventIdx = -1;
  let strongestEventAmplitude = 0;
  let eventCount = 0;
  let events = [];
  let lastAcceptedEventIdx = -Infinity;

  for(let i = startIdx + 1; i < maxSearchIdx - 1; i++){
    const prev = Math.abs(data[i - 1]);
    const curr = Math.abs(data[i]);
    const next = Math.abs(data[i + 1]);

    const neighborhoodMax = Math.max(
      Math.abs(data[i - 2] || 0),
      prev,
      next,
      Math.abs(data[i + 2] || 0)
    );

    const isLocalMaximum = curr > neighborhoodMax;

    const minSpacingSamples = sampleRate * minEventSpacingMs / 1000;

    if(isLocalMaximum && curr > eventThreshold){
      if(i - lastAcceptedEventIdx < minSpacingSamples) continue;
      lastAcceptedEventIdx = i;
      eventCount++;
      if(firstEventIdx < 0){
        firstEventIdx = i;
        firstEventAmplitude = curr;
      }

      const eventTime = (i - peakIdx) / sampleRate * 1000;
      const eventLevelDb = 20 * Math.log10(curr / peakVal);
      events.push({time:eventTime, levelDb:eventLevelDb, polarity:data[i] >= 0 ? '+' : '-', linearAmplitude: curr / peakVal});

      if(curr > strongestEventAmplitude){
        strongestEventIdx = i;
        strongestEventAmplitude = curr;
      }
    }
  }

  const firstEventLevelDb =
    firstEventAmplitude > 0
      ? 20 * Math.log10(firstEventAmplitude / peakVal)
      : null;

  const strongestEventLevelDb =
    strongestEventAmplitude > 0
      ? 20 * Math.log10(strongestEventAmplitude / peakVal)
      : null;
  
  // Energy decay calculation
  const decayStart = peakIdx;
  const decayWindowSamples = Math.floor((sampleRate / 1000) * 100); // 100ms window
  const decayEnd = Math.min(decayStart + decayWindowSamples, data.length);
  let decayEnergy = 0;
  for(let i = decayStart; i < decayEnd; i++){
    decayEnergy += data[i] * data[i];
  }
  decayEnergy = Math.sqrt(decayEnergy);
  
  const totalPrePost = preEnergy + postEnergy;
  
  events.sort((a,b)=>a.time-b.time);

  let totalReflectionEnergy = 0;
  for(const e of events){
    totalReflectionEnergy += e.linearAmplitude * e.linearAmplitude;
  }

  const totalReflectionLevelDb = totalReflectionEnergy > 0
    ? 20 * Math.log10(Math.sqrt(totalReflectionEnergy))
    : null;

  return {
    peakIdx,
    peakVal,
    preEnergy,
    postEnergy,
    crestFactor,
    prePostRatio: totalPrePost > 0 ? postEnergy / totalPrePost : 0,
    firstEventIdx,
    firstEventTime: firstEventIdx >= 0 ? (firstEventIdx - peakIdx) / sampleRate * 1000 : -1,
    firstEventLevelDb,
    strongestEventIdx,
    strongestEventTime: strongestEventIdx >= 0 ? (strongestEventIdx - peakIdx) / sampleRate * 1000 : -1,
    strongestEventLevelDb,
    events,
    eventCount,
    totalReflectionLevelDb,
    decayEnergy,
    dataLength: data.length
  };
}

async function run(){
  log('BUTTON CLICKED');
  try {
    log('Connecting to REW...');
    const r = await fetch('http://localhost:4735/measurements');
    log('HTTP STATUS: ' + r.status);

    const raw = await r.json();
    const arr = Array.isArray(raw) ? raw : Object.values(raw);
    log('Found ' + arr.length + ' measurements');

    const m = {};
    for(const n of REQUIRED){
      m[n] = arr.find(x => x.title === n);
      log((m[n] ? '✓ ' : '✗ ') + n);
    }

    if(REQUIRED.some(n => !m[n])){
      log('Missing required measurements.');
      return;
    }

    const hasLPlusR = arr.find(x => x.title === 'L+R');
    log((hasLPlusR ? '✓ ' : '○ ') + 'L+R (optional)');
    if(hasLPlusR) m['L+R'] = hasLPlusR;

    log('\nDiagnostics complete. Beginning analysis...');

    const p = {};
    REQUIRED.forEach(n => p[n] = m[n].timeOfIRPeakSeconds);
    if(m['L+R']) p['L+R'] = m['L+R'].timeOfIRPeakSeconds;

    // Get sample rate from first available measurement
    let sampleRate = 48000; // default
    for(const key in m){
      if(m[key].sampleRate){
        sampleRate = m[key].sampleRate;
        log(`Sample Rate: ${sampleRate} Hz`);
        break;
      }
    }

    // Analyze IR data
    const irAnalysis = {};
    for(const name of Object.keys(m)){
      if(m[name].irData){
        irAnalysis[name] = analyzeIR(m[name].irData, sampleRate);
      }
    }

    function section(title,aName,a,bName,b,isCenter=false,extraInfo=''){
      const ms = (b-a)*1000;
      const cm = ms*CM_PER_MS;
      const st = classify(cm);

      log('\n' + title);
      log('-'.repeat(title.length));
      log(`${aName}: ${(a*1000).toFixed(3)} ms`);
      log(`${bName}: ${(b*1000).toFixed(3)} ms`);
      log(`Difference: ${ms.toFixed(3)} ms (${cm.toFixed(2)} cm)`);
      log('Status: ' + st);

      return { st };
    }

    // TIMING ANALYSIS
    log('\n\n========== TIMING ANALYSIS ==========\n');

    const flFrMs = (p.FR - p.FL) * 1000;
    const flFrCm = flFrMs * CM_PER_MS;
    const frontResult = section('Front Stage Distance','FL',p.FL,'FR',p.FR);

    const centerFrontMidpoint = (p.FL+p.FR)/2;
    section('Center Alignment','Front Midpoint',centerFrontMidpoint,'Center',p.C,true,Math.abs(flFrCm));

    const slSrMs = (p.SR - p.SL) * 1000;
    const slSrCm = slSrMs * CM_PER_MS;
    const surroundResult = section('Surround Stage Distance','SL',p.SL,'SR',p.SR);

    log('\nLeft Channel Distance');
    log('--------------------');
    log(`FL (Front Left): ${(p.FL*1000).toFixed(3)} ms`);
    log(`SL (Surround Left): ${(p.SL*1000).toFixed(3)} ms`);
    const flSlMs = (p.SL - p.FL) * 1000;
    const flSlCm = flSlMs * CM_PER_MS;
    log(`FL to SL distance offset: ${flSlMs.toFixed(3)} ms (${flSlCm.toFixed(2)} cm)`);
    log('Status: ' + classify(flSlCm));

    log('\nRight Channel Distance');
    log('---------------------');
    log(`FR (Front Right): ${(p.FR*1000).toFixed(3)} ms`);
    log(`SR (Surround Right): ${(p.SR*1000).toFixed(3)} ms`);
    const frSrMs = (p.SR - p.FR) * 1000;
    const frSrCm = frSrMs * CM_PER_MS;
    log(`FR to SR distance offset: ${frSrMs.toFixed(3)} ms (${frSrCm.toFixed(2)} cm)`);
    log('Status: ' + classify(frSrCm));

    log('\nCenter to Front Distance');
    log('------------------------');
    log(`C (Center): ${(p.C*1000).toFixed(3)} ms`);
    log(`FL (Front Left): ${(p.FL*1000).toFixed(3)} ms`);
    const cFlMs = (p.C - p.FL) * 1000;
    const cFlCm = cFlMs * CM_PER_MS;
    log(`C to FL distance offset: ${cFlMs.toFixed(3)} ms (${cFlCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cFlCm)));

    log(`FR (Front Right): ${(p.FR*1000).toFixed(3)} ms`);
    const cFrMs = (p.C - p.FR) * 1000;
    const cFrCm = cFrMs * CM_PER_MS;
    log(`C to FR distance offset: ${cFrMs.toFixed(3)} ms (${cFrCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cFrCm)));

    const cFrontSymmetryMs = cFrMs - cFlMs;
    const cFrontSymmetryCm = cFrontSymmetryMs * CM_PER_MS;
    log(`C symmetry (FR offset - FL offset): ${cFrontSymmetryMs.toFixed(3)} ms (${cFrontSymmetryCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cFrontSymmetryCm)));

    log('\nCenter to Surround Distance');
    log('---------------------------');
    log(`C (Center): ${(p.C*1000).toFixed(3)} ms`);
    log(`SL (Surround Left): ${(p.SL*1000).toFixed(3)} ms`);
    const cSlMs = (p.C - p.SL) * 1000;
    const cSlCm = cSlMs * CM_PER_MS;
    log(`C to SL distance offset: ${cSlMs.toFixed(3)} ms (${cSlCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cSlCm)));

    log(`SR (Surround Right): ${(p.SR*1000).toFixed(3)} ms`);
    const cSrMs = (p.C - p.SR) * 1000;
    const cSrCm = cSrMs * CM_PER_MS;
    log(`C to SR distance offset: ${cSrMs.toFixed(3)} ms (${cSrCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cSrCm)));

    const cSurroundSymmetryMs = cSrMs - cSlMs;
    const cSurroundSymmetryCm = cSurroundSymmetryMs * CM_PER_MS;
    log(`C symmetry (SR offset - SL offset): ${cSurroundSymmetryMs.toFixed(3)} ms (${cSurroundSymmetryCm.toFixed(2)} cm)`);
    log('Status: ' + classify(Math.abs(cSurroundSymmetryCm)));

    if(p['L+R']){
      const lPlusRFrontMidpoint = (p.FL+p.FR)/2;
      const lPlusRMs = (p['L+R'] - lPlusRFrontMidpoint) * 1000;
      const lPlusRCm = lPlusRMs * CM_PER_MS;
      
      log('\nL+R Measurement');
      log('---------------');
      log(`Front Stage Midpoint: ${(lPlusRFrontMidpoint*1000).toFixed(3)} ms`);
      log(`L+R: ${(p['L+R']*1000).toFixed(3)} ms`);
      log(`Difference: ${lPlusRMs.toFixed(3)} ms (${lPlusRCm.toFixed(2)} cm)`);
      log('Status: ' + classify(lPlusRCm));
    }

    // IMPULSE RESPONSE ANALYSIS
    log('\n\n========== IMPULSE RESPONSE ANALYSIS ==========\n');

    for(const name of REQUIRED){
      if(!irAnalysis[name]) continue;
      const ir = irAnalysis[name];

      log(`\n${name} - Impulse Response Metrics`);
      log('-'.repeat(name.length + 25));
      log(`Peak Value: ${ir.peakVal.toFixed(6)}`);
      
      if(ir.firstEventIdx >= 0){
        log(`First Event After Direct Sound: ${ir.firstEventTime.toFixed(2)} ms after peak`);
      } else {
        log(`First Event After Direct Sound: Not detected within analysis window`);
      }
      
      log(`Reflection Count (1-20ms window): ${ir.eventCount}`);
      log(`Decay Energy (0-100ms window): ${ir.decayEnergy.toFixed(6)}`);
      log(`Total IR Data Points: ${ir.dataLength}`);
    }

    // REFLECTION SYMMETRY ANALYSIS
    log('

========== EARLY REFLECTION ANALYSIS ==========
');

    function dumpPair(a,b,label){
      if(!irAnalysis[a] || !irAnalysis[b]) return;
      const irA=irAnalysis[a];
      const irB=irAnalysis[b];

      log(`
${label}`);
      log('-'.repeat(label.length));

      for(const [name,ir] of [[a,irA],[b,irB]]){
        log(`
${name} Reflections (1-20 ms)`);
        log('-'.repeat(name.length + 22));
        if(ir.events.length===0){
          log('No reflections detected.');
          continue;
        }
        ir.events.forEach((e,idx)=>{
          log(`${idx+1}. ${e.time.toFixed(2)} ms @ ${e.levelDb.toFixed(2)} dB`);
        });

        log('');
        log(`First Reflection: ${ir.firstEventTime.toFixed(2)} ms @ ${ir.firstEventLevelDb.toFixed(2)} dB`);
        log(`Strongest Reflection: ${ir.strongestEventTime.toFixed(2)} ms @ ${ir.strongestEventLevelDb.toFixed(2)} dB`);
        log(`Reflection Count: ${ir.eventCount}`);
        if(ir.totalReflectionLevelDb !== null){
          log(`Total Early Reflection Energy: ${ir.totalReflectionLevelDb.toFixed(2)} dB`);
        }
      }

      if(irA.firstEventIdx>=0 && irB.firstEventIdx>=0){
        log('
First Reflection Pair Difference');
        log(`Time Difference: ${Math.abs(irA.firstEventTime-irB.firstEventTime).toFixed(2)} ms`);
        log(`Level Difference: ${Math.abs(irA.firstEventLevelDb-irB.firstEventLevelDb).toFixed(2)} dB`);
      }

      if(irA.strongestEventIdx>=0 && irB.strongestEventIdx>=0){
        log('
Strongest Reflection Pair Difference');
        log(`Time Difference: ${Math.abs(irA.strongestEventTime-irB.strongestEventTime).toFixed(2)} ms`);
        log(`Level Difference: ${Math.abs(irA.strongestEventLevelDb-irB.strongestEventLevelDb).toFixed(2)} dB`);
      }

      log(`
Reflection Count Difference: ${Math.abs(irA.eventCount-irB.eventCount)}`);
    }

    dumpPair('FL','FR','Front Pair Differences');
    dumpPair('SL','SR','Surround Pair Differences');

// EARLY SOUND ANALYSIS
    log('\n\n========== EARLY SOUND ANALYSIS ==========\n');
    log('What is this?');
    log('The direct sound from a speaker reaches your seat first.');
    log('A short time later, sound bounces off walls, the floor, the ceiling, and furniture.');
    log('We measure the first reflection that arrives after the direct sound.');
    log('');
    log('Why does it matter?');
    log('These early sound bounces can affect dialogue clarity, sound placement, and immersion in movies and games.');


    function compareEarlyEvents(a, b, label){
      if(!irAnalysis[a] || !irAnalysis[b]) return;

      const irA = irAnalysis[a];
      const irB = irAnalysis[b];

      log(`
${label}`);
      log('-'.repeat(label.length));

      log(`${a}:`);
      if(irA.firstEventIdx >= 0 && irA.firstEventLevelDb !== null){
        log(`  First reflection after direct sound: ${irA.firstEventTime.toFixed(2)} ms`);
        log(`  Loudness: ${Math.abs(irA.firstEventLevelDb).toFixed(2)} dB lower than the direct sound`);
        if(irA.strongestEventIdx >= 0 && irA.strongestEventLevelDb !== null){
          log(`  Strongest reflection: ${irA.strongestEventTime.toFixed(2)} ms`);
          log(`  Loudness: ${Math.abs(irA.strongestEventLevelDb).toFixed(2)} dB lower than the direct sound`);
        }
        log('');
        log('  In simple terms:');
        log(`  The first reflection that the microphone picked up happened ${irA.firstEventTime.toFixed(2)} ms after the initial sweep, and it was ${Math.abs(irA.firstEventLevelDb).toFixed(2)} dB lower than the original sound.`);
      } else {
        log('  First reflection after direct sound: not detected');
      }

      log('');
      log(`${b}:`);
      if(irB.firstEventIdx >= 0 && irB.firstEventLevelDb !== null){
        log(`  First reflection after direct sound: ${irB.firstEventTime.toFixed(2)} ms`);
        log(`  Loudness: ${Math.abs(irB.firstEventLevelDb).toFixed(2)} dB lower than the direct sound`);
        if(irB.strongestEventIdx >= 0 && irB.strongestEventLevelDb !== null){
          log(`  Strongest reflection: ${irB.strongestEventTime.toFixed(2)} ms`);
          log(`  Loudness: ${Math.abs(irB.strongestEventLevelDb).toFixed(2)} dB lower than the direct sound`);
        }
        log('');
        log('  In simple terms:');
        log(`  The first reflection that the microphone picked up happened ${irB.firstEventTime.toFixed(2)} ms after the initial sweep, and it was ${Math.abs(irB.firstEventLevelDb).toFixed(2)} dB lower than the original sound.`);
      } else {
        log('  First reflection after direct sound: not detected');
      }

      if(irA.firstEventIdx >= 0 && irB.firstEventIdx >= 0 && irA.firstEventLevelDb !== null && irB.firstEventLevelDb !== null){
        const timeDiff = Math.abs(irA.firstEventTime - irB.firstEventTime);
        const levelDiff = Math.abs(irA.firstEventLevelDb - irB.firstEventLevelDb);

        log('');
        log('Left vs Right:');
        log(`  Time difference: ${timeDiff.toFixed(2)} ms`);
        log(`  Loudness difference: ${levelDiff.toFixed(2)} dB`);
        log('');
        log('Reflection Similarity:');

        if(timeDiff < 1 && levelDiff < 3){
          log('  The left and right speakers have very similar early reflections.');
        } else {
          log('  The left and right speakers are hearing the room differently.');
        }

        log('');
        log('  Why compare left and right?');
        log('  Similar reflections can help sounds move smoothly across the room and keep voices centered on screen.');
      }
    }

    compareEarlyEvents('FL', 'FR', 'Front Pair');
    compareEarlyEvents('SL', 'SR', 'Surround Pair');

    log('\n\nAnalysis complete.');

  } catch(e){
    log('ERROR: ' + e);
  }
}

function clear(){
  out.textContent = 'PAGE LOADED\n';
}

document.getElementById('runBtn').addEventListener('click', run);
document.getElementById('clearBtn').addEventListener('click', clear);
</script>
</body>
</html>
